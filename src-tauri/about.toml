# 유료 x64 Windows 릴리스에 포함되는 Rust 구성요소의 고지 생성 기준입니다.
# `cargo about generate --locked --offline`으로 실행해 잠금 파일과 로컬 소스만 사용합니다.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "BSL-1.0",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
]

targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }

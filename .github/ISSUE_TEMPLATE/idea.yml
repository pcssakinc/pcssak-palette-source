name: 사용 경험·개선 제안 / Feedback or idea
description: 실제 작업에서 도움이 된 점이나 불편한 점을 알려 주세요.
title: '[의견] '
body:
  - type: markdown
    attributes:
      value: |
        어떤 언어로든 환영합니다. Any language is welcome.
        색각이상 진단서·실명·사생활 설명은 필요하지 않습니다.
        제안 접수는 구현·기한·채택·보상 약속이 아닙니다. 보상을 기대하는 작업은 시작 전에 상의해 주세요.
        공개할 권리가 없는 이미지나 민감한 원본 자료를 첨부하지 마세요.
  - type: textarea
    id: task
    attributes:
      label: 어떤 작업을 하려 했나요? / Your task
      description: 누구에게 어떤 상황에서 필요한지 설명해 주세요. 개인 신상은 필요하지 않습니다.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: 잘된 점·불편한 점 / Your experience
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 원하는 개선이나 대안 / Suggested improvement
      description: 정답을 알고 있어야 제안할 수 있는 것은 아닙니다.
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 범위 확인
      options:
        - label: 개인정보·비밀정보·허가받지 않은 타인 자료를 제거했습니다.
          required: true
